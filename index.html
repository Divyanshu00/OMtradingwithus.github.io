<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OM Trading With Us</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #fff;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.15) 0%, transparent 50%);
      z-index: -1;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      margin: 60px 0 80px;
    }

    header h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 700;
      background: linear-gradient(45deg, #fff, #f0f0f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
      letter-spacing: -2px;
    }

    ul.pointers {
      max-width: 700px;
      margin: 0 auto 60px;
      padding: 40px 30px;
      font-size: 1.25rem;
      line-height: 1.8;
      list-style: none;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(20px);
      border-radius: 25px;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    ul.pointers li {
      margin-bottom: 20px;
      padding-left: 40px;
      position: relative;
    }

    ul.pointers li::before {
      content: '✓';
      position: absolute;
      left: 0;
      color: #4ade80;
      font-size: 1.5rem;
      font-weight: bold;
    }

    ul.pointers li:last-child {
      margin-bottom: 0;
    }

    .contact {
      max-width: 500px;
      margin: 0 auto 80px;
      padding: 40px 30px;
      font-size: 1.2rem;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(25px);
      border-radius: 20px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 25px 70px rgba(0,0,0,0.4);
      transition: transform 0.3s ease;
    }

    .contact:hover {
      transform: translateY(-8px);
    }

    .contact a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 8px 20px;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 50px;
      display: inline-block;
      margin: 10px 5px;
      transition: all 0.3s ease;
    }

    .contact a:hover {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.8);
      transform: scale(1.05);
    }

    .image-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 25px;
      max-width: 1000px;
      margin: 0 auto 80px;
      padding: 50px 20px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 30px 100px rgba(0,0,0,0.4);
    }

    .image-container img {
      width: 240px;
      height: 180px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      border: 3px solid rgba(255,255,255,0.3);
    }

    .image-container img:hover {
      transform: translateY(-15px) scale(1.08);
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      border-color: rgba(255,255,255,0.6);
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      color: rgba(255,255,255,0.8);
      font-size: 1rem;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(15px);
      border-radius: 20px 20px 0 0;
      margin-top: 40px;
    }

    @media (max-width: 768px) {
      .container { padding: 15px; }
      .image-container img { width: 180px; height: 140px; }
      ul.pointers { padding: 25px 20px; font-size: 1.1rem; }
    }

    @media (max-width: 480px) {
      .image-container { gap: 15px; padding: 30px 15px; }
      .image-container img { width: 150px; height: 120px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>OM Trading</h1>
    </header>

    <ul class="pointers">
      <li>Authorized supplier of Fertilizers, Seeds, Sand, Gravel, Rod, Cement, etc.</li>
      <li>Retail as well as Delivery service for customers.</li>
      <li>For any query, you can reach out to us through the contacts below.</li>
    </ul>

    <div class="contact">
      <p>Phone: <a href="tel:+918409412511">8409412511</a></p>
      <p>Email: <a href="mailto:om.tradingwithus@gmail.com">om.tradingwithus@gmail.com</a></p>
    </div>

    <div class="image-container">
      <img src="images/download.jpg" alt="OM Trading image 1" />
      <img src="images/download (1).jpg" alt="OM Trading image 2" />
      <img src="images/download (2).jpg" alt="OM Trading image 3" />
      <img src="images/download (3).jpg" alt="OM Trading image 4" />
    </div>

    <footer>
      &copy; 2026 OM Trading With Us
    </footer>
  </div>
</body>
</html>
